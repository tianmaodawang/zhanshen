        	<h1>游戏登陆器更新补丁卡住解决办法<br></h1>
<span>2017-09-09 21:47:32&nbsp;&nbsp;&nbsp;来源：&nbsp;&nbsp;&nbsp;</span>
			<div class="content">
			 
				登陆器更新补丁时卡住了，是平时最常见的问题，因为玩家进入过很多私服游戏，每个游戏版本不一样导致的冲突<br>
解决办法是：删除游戏客户端，然后重新安装后重新解压游戏登陆器补丁包。<br>
